[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rflinkplanner"
version = "0.1.0"
description = "Open-source toolkit for RF link-budget calculation and Fresnel-zone clearance analysis for point-to-point wireless link planning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Marco Aurelio Vieira Mejia" }
]
keywords = [
    "rf", "radio", "link-budget", "fresnel-zone", "propagation",
    "telecommunications", "wireless", "okumura-hata", "cost231",
    "rural-connectivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/MarcoAurelioVieiraMejia/rflinkplanner"
Repository = "https://github.com/MarcoAurelioVieiraMejia/rflinkplanner"
Issues = "https://github.com/MarcoAurelioVieiraMejia/rflinkplanner/issues"

[project.scripts]
rflinkplanner = "rflinkplanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
